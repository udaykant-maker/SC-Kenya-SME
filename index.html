<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCB Wealth Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  --blue: #0473EA;
  --blue-dark: #0259B8;
  --blue-light: #E8F1FE;
  --blue-lighter: #F4F8FE;
  --green: #38D200;
  --green-dark: #2AA800;
  --green-light: #E8FBE0;
  --navy: #0F2E5F;
  --ink: #0B1220;
  --ink-soft: #364152;
  --muted: #6B7684;
  --border: #E4E8EE;
  --border-soft: #EEF1F5;
  --surface: #F7F8FA;
  --amber: #F59E0B;
  --amber-light: #FEF3C7;
  --red: #DC2626;
  --red-light: #FEE2E2;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
html, body { height: 100%; }
body {
  font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 248px; flex-shrink: 0; background: #fff;
  border-right: 1px solid var(--border);
  height: 100vh; position: sticky; top: 0;
  display: flex; flex-direction: column;
}
.main { flex: 1; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 12px 32px;
}

/* Sidebar */
.logo { display: flex; align-items: center; gap: 10px; padding: 20px 20px 24px; }
.logo-mark { position: relative; width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--green)); display: flex; align-items: center; justify-content: center; }
.logo-mark-inner { width: 22px; height: 22px; background: #fff; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--blue); letter-spacing: -0.02em; }
.logo-text-main { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.logo-text-sub { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }

.nav { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
.nav-section { padding: 20px 12px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: var(--muted); }
.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-soft); text-align: left; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--surface); }
.nav-item.active { background: var(--blue-light); color: var(--blue-dark); font-weight: 600; }
.nav-item.active svg { stroke-width: 2.4; }
.nav-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px; background: var(--blue); color: #fff; }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
.user-chip:hover { background: var(--surface); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-light); color: var(--blue-dark); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.user-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.user-role { font-size: 10px; color: var(--muted); }

/* Top bar */
.search-wrap { flex: 1; max-width: 576px; position: relative; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.search-input { width: 100%; padding: 8px 12px 8px 36px; font-size: 13px; border-radius: 8px; background: #fff; border: 1px solid var(--border); outline: none; color: var(--ink); }
.search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { padding: 8px; border-radius: 8px; color: var(--ink-soft); position: relative; }
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 17px; height: 17px; display: block; }
.notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.divider-v { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.top-user { display: flex; align-items: center; gap: 8px; }
.top-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--green)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.top-user-info { line-height: 1.2; }
.top-user-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.top-user-sub { font-size: 10px; color: var(--muted); }

/* Page */
.page { padding: 28px 32px; }
.page-narrow { padding: 28px 32px; max-width: 1040px; margin: 0 auto; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs .current { color: var(--ink); }
.crumbs svg { width: 12px; height: 12px; }

.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
h1.page-title { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin-top: 4px; }
h1.page-title-lg { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.15; }
.page-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* Cards */
.card { background: #fff; border: 1px solid var(--border); border-radius: 12px; }
.card-pad-sm { padding: 16px; }
.card-pad { padding: 20px; }
.card-pad-lg { padding: 24px; }
.card-pad-xl { padding: 32px; }

.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.col-span-2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-5 { margin-top: 20px; } .mt-6 { margin-top: 24px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-5 { margin-bottom: 20px; } .mb-6 { margin-bottom: 24px; }
.flex-1 { flex: 1; }
.text-center { text-align: center; }
.text-right { text-align: right; }

/* Typography */
.t-xs { font-size: 11px; }
.t-sm { font-size: 12px; }
.t-md { font-size: 13px; }
.t-base { font-size: 14px; }
.t-lg { font-size: 16px; }
.t-xl { font-size: 18px; }
.t-2xl { font-size: 20px; }
.t-3xl { font-size: 24px; }
.fw-500 { font-weight: 500; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.fw-800 { font-weight: 800; }
.c-ink { color: var(--ink); }
.c-ink-soft { color: var(--ink-soft); }
.c-muted { color: var(--muted); }
.c-blue { color: var(--blue); }
.c-blue-dark { color: var(--blue-dark); }
.c-green-dark { color: var(--green-dark); }
.tracking-tight { letter-spacing: -0.01em; }
.tracking-tighter { letter-spacing: -0.02em; }

/* Badge */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent; }
.badge svg { width: 11px; height: 11px; }
.badge-default { background: var(--surface); color: var(--ink-soft); border-color: var(--border); }
.badge-blue { background: var(--blue-light); color: var(--blue-dark); border-color: #CFE1FC; }
.badge-green { background: var(--green-light); color: var(--green-dark); border-color: #C7F1B6; }
.badge-amber { background: var(--amber-light); color: #92400E; border-color: #FDE68A; }
.badge-red { background: var(--red-light); color: #991B1B; border-color: #FECACA; }
.badge-ink { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; border-radius: 8px; transition: all 0.15s; white-space: nowrap; padding: 8px 16px; font-size: 13px; height: 40px; border: 1px solid transparent; }
.btn:hover:not(:disabled) { filter: brightness(0.95); }
.btn:active:not(:disabled) { filter: brightness(0.9); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
.btn-sm { padding: 6px 12px; font-size: 12px; height: 32px; }
.btn-sm svg { width: 14px; height: 14px; }
.btn-lg { padding: 10px 20px; font-size: 13px; height: 44px; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-secondary { background: #fff; color: var(--ink); border-color: var(--border); }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover:not(:disabled) { background: var(--surface); filter: none; }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-danger { background: #fff; color: var(--red); border-color: rgba(220,38,38,0.2); }
.btn-full { width: 100%; }

/* Input */
.field { display: block; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
.field-hint { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
.field-error { display: block; font-size: 11px; color: var(--red); margin-top: 4px; }
.input-wrap { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,0.03); transition: all 0.15s; }
.input-wrap:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
.input-prefix { padding-left: 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
.input { width: 100%; padding: 10px 12px; font-size: 13px; background: transparent; border: none; outline: none; color: var(--ink); }
.input::placeholder { color: #94A3B8; }

.select-wrap { position: relative; }
.select { width: 100%; appearance: none; -webkit-appearance: none; padding: 10px 36px 10px 12px; font-size: 13px; background: #fff; border: 1px solid var(--border); border-radius: 8px; outline: none; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,0.03); cursor: pointer; }
.select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
.select-chevron { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; width: 16px; height: 16px; }

/* Table */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table thead tr { background: var(--surface); }
.table th { text-align: left; padding: 10px 0; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.table th:first-child, .table td:first-child { padding-left: 20px; }
.table th:last-child, .table td:last-child { padding-right: 20px; }
.table tbody tr { border-top: 1px solid var(--border-soft); cursor: pointer; transition: background 0.1s; }
.table tbody tr:hover { background: rgba(247,248,250,0.6); }
.table td { padding: 12px 0; }
.table .numeric { text-align: right; }

/* Stats */
.stat-card { padding: 20px; }
.stat-label { font-size: 11px; font-weight: 500; color: var(--muted); }
.stat-value { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin-top: 8px; }
.stat-value-sm { font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; margin-top: 4px; }
.stat-sub { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.stat-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon-blue { background: var(--blue-light); color: var(--blue-dark); }
.stat-icon-green { background: var(--green-light); color: var(--green-dark); }
.stat-icon-amber { background: var(--amber-light); color: #92400E; }
.stat-icon-default { background: var(--surface); color: var(--ink-soft); }
.stat-icon svg { width: 18px; height: 18px; }

/* Status live pill */
.status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--green-light); border: 1px solid #C7F1B6; font-size: 12px; font-weight: 600; color: var(--green-dark); }
.pulse-dot { position: relative; display: inline-flex; width: 8px; height: 8px; }
.pulse-dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green); opacity: 0.6; animation: ping 1.5s cubic-bezier(0,0,0.2,1) infinite; }
.pulse-dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green); }
@keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }

/* Greeting gradient */
.gradient-text { background: linear-gradient(120deg, var(--blue), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Fund row */
.fund-row { padding: 16px; border-radius: 8px; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border-soft); transition: background 0.15s; }
.fund-row:hover { background: var(--surface); }
.fund-icon { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--green)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fund-icon svg { width: 16px; height: 16px; color: #fff; stroke-width: 2.4; }

/* Progress bar */
.progress { height: 6px; border-radius: 3px; overflow: hidden; background: var(--border-soft); }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

/* Quick action card */
.qa-card { text-align: left; padding: 20px; border-radius: 12px; background: #fff; border: 1px solid var(--border); transition: all 0.2s; cursor: pointer; }
.qa-card:hover { box-shadow: 0 8px 24px rgba(15,23,42,0.08); transform: translateY(-1px); }
.qa-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.qa-icon svg { width: 18px; height: 18px; stroke-width: 2.2; }
.qa-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.qa-desc { font-size: 11px; line-height: 1.4; color: var(--muted); }
.qa-cta { display: flex; align-items: center; gap: 4px; margin-top: 16px; font-size: 11px; font-weight: 600; opacity: 0; transition: opacity 0.2s; }
.qa-card:hover .qa-cta { opacity: 1; }
.qa-cta svg { width: 12px; height: 12px; }

/* Wizard step indicator */
.steps { display: flex; align-items: center; gap: 8px; }
.step-item { flex: 1; display: flex; align-items: center; gap: 8px; }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: var(--muted); transition: all 0.2s; flex-shrink: 0; }
.step-dot.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.step-dot.done { background: var(--green); color: #fff; border-color: var(--green); }
.step-dot svg { width: 13px; height: 13px; stroke-width: 3; }
.step-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.step-label.active { color: var(--ink); }
.step-label.done { color: var(--ink-soft); }
.step-line { flex: 1; height: 1px; background: var(--border); }
.step-line.done { background: var(--green); }

/* Selectable row */
.select-row { width: 100%; text-align: left; padding: 16px; border-radius: 8px; display: flex; align-items: center; gap: 16px; background: #fff; border: 2px solid var(--border); transition: all 0.15s; cursor: pointer; }
.select-row:hover { border-color: #CFE1FC; }
.select-row.selected { border-color: var(--blue); background: var(--blue-lighter); }
.select-row-avatar { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.select-row-avatar.blue { background: var(--blue-light); color: var(--blue-dark); }
.select-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.select-row.selected .select-check { background: var(--blue); border-color: var(--blue); }
.select-check svg { width: 12px; height: 12px; color: #fff; stroke-width: 3; display: none; }
.select-row.selected .select-check svg { display: block; }

/* Info banner */
.info-banner { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 8px; font-size: 12px; }
.info-banner svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
.info-banner.blue { background: var(--blue-lighter); border: 1px solid var(--blue-light); color: var(--ink-soft); }
.info-banner.blue svg { color: var(--blue-dark); }
.info-banner.amber { background: var(--amber-light); border: 1px solid #FDE68A; color: #78350F; }
.info-banner.amber svg { color: #92400E; }
.info-banner.red { background: var(--red-light); border: 1px solid #FECACA; color: #991B1B; }
.info-banner.red svg { color: var(--red); }

/* Review rows */
.review-box { border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.review-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border-soft); }
.review-row:first-child { border-top: none; }
.review-row:nth-child(even) { background: var(--surface); }
.review-key { font-size: 11px; font-weight: 600; color: var(--muted); }
.review-val { font-size: 13px; font-weight: 600; color: var(--ink); text-align: right; }
.review-sub { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }

/* Timeline */
.timeline { display: flex; flex-direction: column; }
.timeline-item { display: flex; gap: 16px; }
.timeline-spine { display: flex; flex-direction: column; align-items: center; }
.timeline-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.timeline-dot.done { background: var(--green); border-color: var(--green); }
.timeline-dot.active { background: var(--blue); border-color: var(--blue); }
.timeline-dot.failed { background: var(--red); border-color: var(--red); }
.timeline-dot svg { width: 13px; height: 13px; color: #fff; stroke-width: 3; }
.timeline-dot.pending svg { color: var(--muted); width: 6px; height: 6px; stroke-width: 2; }
.timeline-line { flex: 1; width: 1px; background: var(--border); min-height: 32px; }
.timeline-line.done { background: var(--green); }
.timeline-content { flex: 1; padding-bottom: 24px; }
.timeline-title { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.timeline-title.pending { color: var(--muted); }
.timeline-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.timeline-ts { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* Toggle */
.toggle { width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
.toggle.on { background: var(--blue); }
.toggle-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: left 0.15s; }
.toggle.on .toggle-thumb { left: 18px; }

/* Avatar */
.avatar { border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.avatar-sm { width: 32px; height: 32px; font-size: 11px; }
.avatar-md { width: 40px; height: 40px; font-size: 12px; }
.avatar-lg { width: 56px; height: 56px; font-size: 16px; border-radius: 12px; }
.avatar-blue { background: var(--blue-light); color: var(--blue-dark); }
.avatar-gradient { background: linear-gradient(135deg, var(--blue), var(--green)); color: #fff; }

/* Success icon */
.success-circle { width: 64px; height: 64px; border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.success-circle svg { width: 32px; height: 32px; color: var(--green-dark); stroke-width: 2.2; }

// ========== CUSTOMER ONBOARDING WIZARD ==========
function renderStepHeader(steps, current) {
  return `
    <div class="steps">
      ${steps.map((s, i) => {
        const done = i < current, active = i === current;
        return `
          <div class="step-item">
            <div class="row gap-2" style="flex-shrink:0;">
              <div class="step-dot ${done ? "done" : active ? "active" : ""}">${done ? '<i data-lucide="check"></i>' : (i + 1)}</div>
              <div class="step-label ${done ? "done" : active ? "active" : ""}">${s}</div>
            </div>
            ${i < steps.length - 1 ? `<div class="step-line ${done ? "done" : ""}"></div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;
}

      <div class="card card-pad-lg">${renderStepHeader(steps, w.step)}</div>
      ${body}
      ${footer}
    </div>
  `;
}

// ========== TIMELINE HELPER ==========
function renderTimeline(events) {
  return events.map((t, i, arr) => {
    let iconHtml = '<i data-lucide="circle" style="width:6px;height:6px;color:var(--muted);"></i>';
    if (t.status === "done") iconHtml = '<i data-lucide="check"></i>';
    else if (t.status === "active") iconHtml = '<i data-lucide="loader-2" class="spin"></i>';
    else if (t.status === "failed") iconHtml = '<i data-lucide="x"></i>';
    return `
      <div class="timeline-item">
        <div class="timeline-spine">
          <div class="timeline-dot ${t.status}">${iconHtml}</div>
          ${i < arr.length - 1 ? `<div class="timeline-line ${t.status === "done" ? "done" : ""}"></div>` : ""}
        </div>
        <div class="timeline-content">
          <div class="timeline-title ${t.status === "pending" ? "pending" : ""}">
            ${t.label}
            ${t.status === "active" ? badge("In progress", "blue") : ""}
            ${t.status === "failed" ? badge("Failed", "red") : ""}
          </div>
          <div class="timeline-desc">${t.desc}</div>
          <div class="timeline-ts font-mono">${t.ts}</div>
        </div>
      </div>
    `;
  }).join("");
}

            <div class="row justify-between mb-3">
              <div style="width:36px;height:36px;border-radius:8px;background:var(--blue-light);color:var(--blue-dark);display:flex;align-items:center;justify-content:center;"><i data-lucide="${c.icon}" style="width:16px;height:16px;"></i></div>
              <span class="badge badge-blue">${c.badge}</span>
            </div>
            <div class="t-md fw-700 c-ink">${c.title}</div>
            <div class="t-xs c-muted mt-1">${c.desc}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

// ========== PLACEHOLDER ==========
function renderPlaceholder(title, icon, desc) {
  return `
    <div class="page">
      ${crumbs([{label:"Dashboard", to:"dashboard"}, {label:title}])}
      <h1 class="page-title">${title}</h1>
      <p class="page-desc mb-5">${desc}</p>
      <div class="card empty-state">
        <div class="empty-icon"><i data-lucide="${icon}"></i></div>
        <div class="t-md fw-700 c-ink">Module preview</div>
        <div class="t-xs c-muted mt-1" style="max-width:380px;margin-left:auto;margin-right:auto;">This area is covered in the full PRD. The onboarding and buy/sell flows are fully interactive in this prototype.</div>
        <div class="row gap-2 justify-center mt-5">
          <button class="btn btn-secondary" data-nav-link="customers">Open customers</button>
          <button class="btn btn-primary" data-nav-link="buy-new"><i data-lucide="shopping-cart"></i>New buy order</button>
        </div>
      </div>
    </div>
  `;
}

// ========== EVENT HANDLERS ==========
function attachHandlers() {
  // Sidebar
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => navigate(el.dataset.nav));

  // Nav links (buttons, rows, crumbs)
  document.querySelectorAll("[data-nav-link]").forEach(el => el.addEventListener("click", (e) => {
    e.preventDefault();
    navigate(el.dataset.navLink);
  }));

  // Customer row clicks (list)
  document.querySelectorAll("[data-customer]").forEach(el => el.onclick = () => navigate("customer-detail", { id: el.dataset.customer }));

  // Order row clicks
  document.querySelectorAll("[data-order]").forEach(el => el.onclick = () => navigate(el.dataset.orderType === "Buy" ? "buy-detail" : "sell-detail", { id: el.dataset.order }));

  // Customer search
  const custSearch = document.getElementById("cust-search");
  if (custSearch) custSearch.oninput = (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = CUSTOMERS.filter(c => [c.name, c.relId, c.id].join(" ").toLowerCase().includes(q));
    document.getElementById("cust-tbody").innerHTML = renderCustomerRows(filtered);
    lucide.createIcons();
    filtered.forEach(() => {});
    document.querySelectorAll("[data-customer]").forEach(el => el.onclick = () => navigate("customer-detail", { id: el.dataset.customer }));
  };

  // Customer wizard
  const cwRelId = document.getElementById("cw-relid");
  if (cwRelId) cwRelId.oninput = (e) => { app.cw.relId = e.target.value; };
  const cwFetch = document.getElementById("cw-fetch");
  if (cwFetch) cwFetch.onclick = () => {
    app.cw.fetching = true;
    render();
    setTimeout(() => {
      app.cw.fetching = false;
      app.cw.fetched = {
        relId: app.cw.relId || "SC90152208",
        name: "Kenani Dairy Cooperative Ltd",
        type: "SME — Cooperative",
        registration: "RC-KE-2014-1188",
        tin: "P051449211X",
        email: "finance@kenanidairy.co.ke",
        phone: "+254 772 445 019",
        address: "Eldoret Industrial Park, Uasin Gishu",
        director: "Grace N. Wanyama",
        kycStatus: "Verified",
        kycTier: "Tier 2",
        bankAccounts: [
          { no: "0100-6612-09-01", type: "Current Account", currency: "KES", balance: "5,288,000", primary: true },
          { no: "0100-6612-09-02", type: "Call Account", currency: "KES", balance: "682,000", primary: false },
          { no: "0100-6612-09-55", type: "USD Current", currency: "USD", balance: "42,100", primary: false },
        ],
      };
      app.cw.step = 1;
      render();
    }, 1400);
  };
  document.querySelectorAll("[data-acct]").forEach(el => el.onclick = () => { app.cw.selectedAccount = Number(el.dataset.acct); render(); });
  const cwBack = document.getElementById("cw-back");
  if (cwBack) cwBack.onclick = () => { if (app.cw.step === 0) navigate("customers"); else { app.cw.step--; render(); } };
  const cwNext = document.getElementById("cw-next");
  if (cwNext) cwNext.onclick = () => { app.cw.step++; render(); };
  const cwCreate = document.getElementById("cw-create");
  if (cwCreate) cwCreate.onclick = () => {
    app.cw.creating = true;
    render();
    setTimeout(() => { app.cw.creating = false; app.cw.created = true; render(); }, 1800);
  };

  // Buy wizard
  document.querySelectorAll("[data-bw-customer]").forEach(el => el.onclick = () => { app.bw.customer = CUSTOMERS.find(c => c.id === el.dataset.bwCustomer); render(); });
  document.querySelectorAll("[data-bw-fund]").forEach(el => el.onclick = () => { app.bw.fund = FUNDS.find(f => f.code === el.dataset.bwFund); render(); });
  document.querySelectorAll("[data-bw-acct]").forEach(el => el.onclick = () => { app.bw.bankAcct = Number(el.dataset.bwAcct); render(); });
  const bwAmount = document.getElementById("bw-amount");
  if (bwAmount) { bwAmount.oninput = (e) => { app.bw.amount = e.target.value; }; bwAmount.onblur = () => render(); }
  const bwToggle = document.getElementById("bw-recurring-toggle");
  if (bwToggle) bwToggle.onclick = () => { app.bw.recurring = !app.bw.recurring; render(); };
  const bwBack = document.getElementById("bw-back");
  if (bwBack) bwBack.onclick = () => { if (app.bw.step === 0) navigate("buy-orders"); else { app.bw.step--; render(); } };
  const bwNext = document.getElementById("bw-next");
  if (bwNext) bwNext.onclick = () => { app.bw.step++; render(); };
  const bwSubmit = document.getElementById("bw-submit");
  if (bwSubmit) bwSubmit.onclick = () => {
    app.bw.submitting = true;
    render();
    setTimeout(() => { app.bw.submitting = false; app.bw.submitted = true; app.bw.step = 3; render(); }, 1600);
  };
  const bwAnother = document.getElementById("bw-another");
  if (bwAnother) bwAnother.onclick = () => { app.bw = { step: 0, customer: null, fund: null, amount: "", bankAcct: 0, recurring: false, submitting: false, submitted: false }; render(); };

  // Sell wizard
  document.querySelectorAll("[data-sw-customer]").forEach(el => el.onclick = () => { app.sw.customer = CUSTOMERS.find(c => c.id === el.dataset.swCustomer); render(); });
  document.querySelectorAll("[data-sw-mode]").forEach(el => el.onclick = () => {
    app.sw.mode = el.dataset.swMode;
    if (app.sw.mode === "full") app.sw.amount = "18,420,500";
    render();
  });
  const swAmount = document.getElementById("sw-amount");
  if (swAmount) { swAmount.oninput = (e) => { app.sw.amount = e.target.value; }; swAmount.onblur = () => render(); }
  const swBack = document.getElementById("sw-back");
  if (swBack) swBack.onclick = () => { if (app.sw.step === 0) navigate("sell-orders"); else { app.sw.step--; render(); } };
  const swNext = document.getElementById("sw-next");
  if (swNext) swNext.onclick = () => { app.sw.step++; render(); };
  const swSubmit = document.getElementById("sw-submit");
  if (swSubmit) swSubmit.onclick = () => {
    app.sw.submitting = true;
    render();
    setTimeout(() => { app.sw.submitting = false; app.sw.submitted = true; app.sw.step = 3; render(); }, 1600);
  };
  const swViewCust = document.getElementById("sw-view-cust");
  if (swViewCust) swViewCust.onclick = () => navigate("customer-detail", { id: app.sw.customer?.id });
}

// ========== BOOT ==========
document.addEventListener("DOMContentLoaded", () => {
  lucide.createIcons();
  render();
});
</script>
</body>
</html>
